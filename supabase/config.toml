# Local Supabase for development (`supabase start`). The hosted project is configured in the Supabase dashboard;
# only the migrations in ./migrations are applied to it (`supabase db push`, or paste the SQL into the SQL editor).
project_id = "favourite-recipes"

[api]
enabled = true
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:4000"
additional_redirect_urls = ["http://localhost:4000/**"]
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
