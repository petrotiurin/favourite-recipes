name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The MCP server deploys to Vercel on its own; changes to it don't need a site rebuild.
    paths-ignore:
      - "mcp-server/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A deploy that has started always finishes (cancelling actions/deploy-pages
# mid-flight can leave Pages stuck); pushes that arrive meanwhile collapse into a single queued run
# for the newest commit. The recipes MCP server batches its changes (batch_changes) to keep pushes rare.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # The resized copies of the recipe photos (Astro's image cache). Restored after `npm ci`, which empties node_modules. The key changes with the
      # photos; the restore key brings back the last cache, so a build only resizes the photos that are new since.
      - uses: actions/cache@v4
        with:
          path: node_modules/.astro/assets
          key: astro-images-${{ hashFiles('images/recipes/**') }}
          restore-keys: astro-images-
      - run: npm run build
        env:
          # Public values for the shopping page's stocktake sign-in (Settings -> Secrets and variables -> Actions -> Variables).
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          STOCKTAKE_API_URL: ${{ vars.STOCKTAKE_API_URL }}
          # Where the chat widget posts (the MCP server's /chat). Without it the site has no chat bubble.
          CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
