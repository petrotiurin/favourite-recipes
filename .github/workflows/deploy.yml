name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # The MCP server deploys to Vercel on its own; changes to it don't need a site rebuild.
    paths-ignore:
      - "mcp-server/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A deploy that has started always finishes (cancelling actions/deploy-pages
# mid-flight can leave Pages stuck); pushes that arrive meanwhile collapse into a single queued run
# for the newest commit. The recipes MCP server batches its changes (batch_changes) to keep pushes rare.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
